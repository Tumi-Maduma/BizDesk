<div class="login-page">

    <div class="login-card">

        <div class="brand">

            <div class="logo">
                B
            </div>

            <div>
                <h1>BizDesk</h1>
                <p>IT Support Management</p>
            </div>

        </div>


        <div class="login-heading">

            <h2>Welcome back</h2>

            <p>
                Sign in to your BizDesk account
            </p>

        </div>


        <form (ngSubmit)="login()">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    [(ngModel)]="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            @if (errorMessage) {

                <div class="error-message">
                    {{ errorMessage }}
                </div>

            }


            <button type="submit">
                Sign In
            </button>

        </form>

    </div>

</div>
